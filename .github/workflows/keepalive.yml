name: Keepalive

# گیت‌هاب workflowهای زمان‌بندی‌شده را بعد از ۶۰ روز بدون فعالیت ریپو خاموش می‌کند؛
# این کامیتِ ماهانهِ خالی تایمر را ریست می‌کند تا بات خوش‌آمدگویی همیشه روشن بماند.
on:
  schedule:
    - cron: "0 3 2 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Empty commit to keep scheduled workflows enabled
        run: |
          git config user.name "cursed-flight-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive — keep scheduled workflows enabled"
          git push
